
server:
  port: 8081

spring:
  application:
    name: activity-app

  config:
    import: "optional:file:.env[.properties]"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${PLATFORM_EMAIL}
    password: ${APP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    mongodb:
      uri: mongodb://localhost:27017/activity_db
      database: activity_db

jwt:
  secret: ${JWT_SECRET:ChangeThisSecretInProduction1234567890123456}
  expirationMillis: 86400000

logging:
  level:
    org.springframework.security: DEBUG